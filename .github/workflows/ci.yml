name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when new commits are pushed to the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep this in sync with .python-version and requires-python in pyproject.toml.
  PYTHON_VERSION: "3.14"

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # uv.lock is gitignored, so the environment is resolved fresh on every run
      # rather than installed from a committed lockfile.
      - name: Install dependencies
        run: uv sync

      # The hook environments are rebuilt from scratch otherwise, which dominates
      # the job's runtime.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # --benchmark-skip drops the timing runs: wall-clock numbers from a shared
      # CI runner are too noisy to be worth anything, and they add ~40 s. The
      # correctness check that all three back ends agree is NOT a benchmark and
      # still runs here.
      - name: Run tests
        run: uv run pytest --benchmark-skip -q
